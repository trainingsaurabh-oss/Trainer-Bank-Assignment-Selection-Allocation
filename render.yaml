services:
  - type: web
    name: trainer-assignment-bridge
    branch: feat/trainer-assignment-bridge
    runtime: node
    plan: starter
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: bridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_PATH
        value: /var/data/bridge.sqlite
      - key: NODE_ENV
        value: production
