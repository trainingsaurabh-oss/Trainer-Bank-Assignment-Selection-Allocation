services:
  - type: web
    name: trainer-assignment-bridge
    runtime: node
    plan: starter
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: bridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_PATH
        value: /var/data/bridge.sqlite
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
